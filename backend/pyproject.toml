[project]
name = "meridian-backend"
version = "0.1.0"
description = "Meridian FRC Attendance System - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "Pillow>=10.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.1.0",
    "wallet>=0.0.1",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
