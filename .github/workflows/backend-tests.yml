name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian
      JWT_SECRET: test-jwt-secret
      PGP_SYM_KEY: test-pgp-key
      NFC_HMAC_SECRET: test-nfc-secret
      CRON_SECRET: test-cron-secret
      SCANNER_API_KEY: test-scanner-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pytest-asyncio pyotp redis sqlalchemy pydantic pydantic-settings
      - name: Run tests
        run: pytest -q
